<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用使用时间统计</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .chart-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .chart {
            flex: 1;
            height: 400px;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .app-list {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .app-item {
            margin-bottom: 20px;
        }
        .app-header {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #eee;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-header:hover {
            background-color: #f5f5f5;
        }
        .app-header::after {
            content: '▼';
            font-size: 0.8em;
            margin-left: 10px;
            transition: transform 0.3s;
        }
        .app-header.collapsed::after {
            transform: rotate(-90deg);
        }
        .window-list {
            margin-left: 20px;
            transition: max-height 0.3s ease-out;
            overflow: hidden;
        }
        .window-list.collapsed {
            max-height: 0;
            margin-bottom: 0;
        }
        .window-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            color: #666;
        }
        .window-title {
            flex: 1;
            margin-right: 20px;
        }
        .window-time {
            color: #888;
            white-space: nowrap;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>应用使用时间统计</h1>
        <div class="chart-container">
            <div id="pieChart" class="chart"></div>
            <div id="barChart" class="chart"></div>
        </div>
        <div id="appList" class="app-list">
            <h2>应用窗口详细统计</h2>
        </div>
    </div>

    <script>
        // 初始化图表
        const pieChart = echarts.init(document.getElementById('pieChart'));
        const barChart = echarts.init(document.getElementById('barChart'));

        // 从本地JSON文件加载数据
        fetch('/api/screentime')
            .then(response => response.json())
            .then(data => {
                const apps = data.apps;
                
                // 准备图表数据
                const chartData = apps.map(app => ({
                    name: app.process_name,
                    value: app.total_time_minutes.toFixed(2)
                }));

                // 计算总时间
                const totalTime = chartData.reduce((sum, item) => sum + parseFloat(item.value), 0);
                // 处理饼图数据，显示前6个应用，其余归入"其他"
                const TOP_N = 3;
                let othersValue = 0;
                const pieData = chartData
                    .sort((a, b) => parseFloat(b.value) - parseFloat(a.value))
                    .reduce((acc, item, index) => {
                        if (index < TOP_N) {
                            acc.push(item);
                        } else {
                            othersValue += parseFloat(item.value);
                        }
                        return acc;
                    }, []);
                // 如果有小于阈值的项目，添加"其他"类别
                if (othersValue > 0) {
                    pieData.push({
                        name: '其他应用',
                        value: othersValue.toFixed(2)
                    });
                }

                // 饼图配置
                const pieOption = {
                    title: {
                        text: '应用使用时间分布',
                        left: 'center'
                    },
                    tooltip: {
                        trigger: 'item',
                        formatter: '{b}: {c}分钟 ({d}%)'
                    },
                    legend: {
                        orient: 'vertical',
                        left: 'left',
                        type: 'scroll'
                    },
                    series: [{
                        name: '使用时间',
                        type: 'pie',
                        radius: '60%',
                        data: pieData,
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                            }
                        }
                    }]
                };

                // 柱状图配置
                const barOption = {
                    title: {
                        text: '应用使用时间统计',
                        left: 'center'
                    },
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'shadow'
                        }
                    },
                    xAxis: {
                        type: 'category',
                        data: chartData.map(item => item.name),
                        axisLabel: {
                            interval: 0,
                            rotate: 30
                        }
                    },
                    yAxis: {
                        type: 'value',
                        name: '分钟'
                    },
                    series: [{
                        data: chartData.map(item => item.value),
                        type: 'bar',
                        showBackground: true,
                        backgroundStyle: {
                            color: 'rgba(180, 180, 180, 0.2)'
                        }
                    }]
                };

                // 渲染图表
                pieChart.setOption(pieOption);
                barChart.setOption(barOption);

                // 渲染应用列表
                const appList = document.getElementById('appList');
                
                // 按总时间排序应用
                const sortedApps = apps.slice().sort((a, b) => b.total_time_minutes - a.total_time_minutes);
                
                sortedApps.forEach(app => {
                    const appDiv = document.createElement('div');
                    appDiv.className = 'app-item';
                    
                    const appHeader = document.createElement('div');
                    appHeader.className = 'app-header collapsed';
                    const totalTimeSeconds = Math.floor(app.total_time_minutes * 60);
                    const minutes = Math.floor(totalTimeSeconds / 60);
                    const seconds = totalTimeSeconds % 60;
                    const headerText = document.createElement('span');
                    headerText.textContent = `${app.process_name} (总计: ${minutes}分 ${seconds}秒)`;
                    appHeader.appendChild(headerText);
                    
                    const windowList = document.createElement('div');
                    windowList.className = 'window-list collapsed';
                    
                    // 按时间排序窗口
                    const sortedWindows = app.windows.slice().sort((a, b) => b.total_time_minutes - a.total_time_minutes);
                    
                    sortedWindows.forEach(window => {
                        const windowItem = document.createElement('div');
                        windowItem.className = 'window-item';
                        
                        const windowTitle = document.createElement('div');
                        windowTitle.className = 'window-title';
                        windowTitle.textContent = window.window_title || '(无标题窗口)';
                        
                        const windowTime = document.createElement('div');
                        windowTime.className = 'window-time';
                        const totalTimeSeconds = Math.floor(window.total_time_minutes * 60);
                        const minutes = Math.floor(totalTimeSeconds / 60);
                        const seconds = totalTimeSeconds % 60;
                        windowTime.textContent = `${minutes}分 ${seconds}秒`;
                        
                        windowItem.appendChild(windowTitle);
                        windowItem.appendChild(windowTime);
                        windowList.appendChild(windowItem);
                    });
                    
                    // 添加点击事件处理折叠/展开
                    appHeader.addEventListener('click', () => {
                        appHeader.classList.toggle('collapsed');
                        windowList.classList.toggle('collapsed');
                        
                        // 设置具体高度以启用动画
                        if (!windowList.classList.contains('collapsed')) {
                            windowList.style.maxHeight = windowList.scrollHeight + 'px';
                        } else {
                            windowList.style.maxHeight = '0';
                        }
                    });
                    
                    appDiv.appendChild(appHeader);
                    appDiv.appendChild(windowList);
                    appList.appendChild(appDiv);
                });
            });

        // 响应式调整
        window.addEventListener('resize', () => {
            pieChart.resize();
            barChart.resize();
        });
    </script>
</body>
</html>
